- name: create instances
  hosts: local
  connection: local
  vars:
   ami_id: "ami-0220d79f3f480ecf5" # replace with your AMI ID, you can use the same AMI for all instances as we are going to install the software in the next steps
   sg_id: "sg-031674407f289d035"  # replace with your SG ID
   zone_id: "Z07436271Q3L1R10WFWTQ" # replace with your ID
   domain_name: "chandrahasa.online"
  #  instances:       #we can pass instances through -e command line
  #   - mongodb
  #   - catalogue
  #   - redis
  #   - mysql
  #   - rabbitmq
  #   - cart
  #   - user
  #   - shipping
  #   - payment
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      instance_type: t2.micro
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      tags:
        Name: "{{ item }}"
    loop: "{{ instances }}"
    register: ec2_output

    # - name: print ec2-instaces
    #   ansible.builtin.debug:
    #    msg: "{{ ec2_output }}"  

    # public_ip addres
  # - name: print public_ip
  #   ansible.builtin.debug: 
  #     msg: "{{ item.instances[0].public_ip_address }}"
  #   loop: "{{ ec2_output.results }}"
  #   # private_ip address
  # - name: print private_ip
  #   ansible.builtin.debug: 
  #     msg: "{{ item.instances[0].private_ip_address }}"
  #   loop: "{{ ec2_output.results }}"

  - name: create route53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"  
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    when: item.item != "frontend"  
    loop: "{{ ec2_output.results }}"   

      # we are creating one record with public only for frontend
  - name: create route53 record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}" # daws86s.fun
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    when: item.item == "frontend"
    loop: "{{ ec2_output.results }}"